---
# 情景1: 金融机构联合风险评估 (MASCOT协议)
# 三家银行联合进行客户信用风险评估，保护客户隐私

# System Settings
system:
  name: "Financial Risk Assessment MPC System"
  version: "1.0.0"
  log_level: "INFO"
  max_parties: 3
  default_protocol: "mascot"

# MP-SPDZ Configuration
mp_spdz:
  installation_path: "/mnt/c/Users/Lenovo/source/repos/MP-SPDZ"
  compile_script: "compile.py"
  default_field_size: 64
  default_ring_size: 64

# Protocol Settings - 高安全性金融场景
protocols:
  mascot:
    security_model: "malicious"
    adversary_model: "dishonest_majority"
    supports_preprocessing: true
    field_size: 64
    timeout_seconds: 600  # 更长的超时时间用于复杂计算
  
  shamir:
    security_model: "semi_honest"
    adversary_model: "honest_majority"
    supports_preprocessing: false
    field_size: 64
    timeout_seconds: 300

# Security Configuration - 金融级安全
security:
  authentication:
    token_expiry_minutes: 30    # 较短的令牌有效期
    max_failed_attempts: 3      # 更严格的失败限制
    lockout_duration_minutes: 60
  
  access_control:
    default_role: "participant"
    max_denied_attempts: 3
    lockout_duration_minutes: 60
  
  audit:
    storage_dir: "audit_logs_financial"
    max_file_size: 5242880  # 5MB
    compression: true
    retention_days: 365     # 金融合规要求长期保存

# Privacy Settings - 严格的隐私保护
privacy:
  differential_privacy:
    epsilon: 0.5            # 更严格的隐私预算
    delta: 0.00001
  
  k_anonymity:
    k: 10                   # 更高的k值
  
  l_diversity:
    l: 5                    # 更高的l值
  
  default_privacy_level: "high"
  suppress_small_counts: true
  small_count_threshold: 10

# Data Processing - 金融数据特殊处理
data_processing:
  max_input_size_mb: 500    # 更大的数据容量
  supported_formats: ["csv", "json", "parquet", "encrypted_csv"]
  default_encoding: "utf-8"
  missing_value_strategies: ["mean", "median", "interpolation", "secure_imputation"]
  
# Results Configuration
results:
  aggregation:
    quality_weights: true
    confidence_weights: true
    default_quality_threshold: 0.8   # 更高的质量要求
    default_confidence_threshold: 0.95
  
  visualization:
    default_format: "png"
    default_width: 1200
    default_height: 800
    default_style: "professional"
    privacy_level: "high"

# Network Configuration
network:
  default_host: "localhost"
  port_base: 6000
  ssl_enabled: true
  cert_dir: "certs_financial"
  timeout_seconds: 60

# Database Configuration
database:
  type: "encrypted_sqlite"
  path: "financial_mpc_analysis.db"
  backup_enabled: true
  backup_interval_hours: 6
  encryption_enabled: true

# Financial Specific Settings
financial:
  risk_models:
    - "credit_scoring"
    - "default_prediction" 
    - "fraud_detection"
    - "portfolio_risk"
  
  regulatory_compliance:
    - "BASEL_III"
    - "GDPR"
    - "PCI_DSS"
    - "SOX"
  
  institutions:
    - name: "Bank Alpha"
      party_id: 0
      risk_tolerance: "conservative"
      data_size: "large"
    - name: "Bank Beta" 
      party_id: 1
      risk_tolerance: "moderate"
      data_size: "medium"
    - name: "Bank Gamma"
      party_id: 2
      risk_tolerance: "aggressive"
      data_size: "large"