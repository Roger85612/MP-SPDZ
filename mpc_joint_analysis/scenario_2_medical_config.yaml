---
# 情景2: 医疗机构联合研究 (Shamir协议)
# 三家医院联合进行药物疗效研究，保护患者隐私

# System Settings
system:
  name: "Medical Research Collaboration MPC System"
  version: "1.0.0"
  log_level: "INFO"
  max_parties: 3
  default_protocol: "shamir"

# MP-SPDZ Configuration
mp_spdz:
  installation_path: "/mnt/c/Users/Lenovo/source/repos/MP-SPDZ"
  compile_script: "compile.py"
  default_field_size: 64
  default_ring_size: 64

# Protocol Settings - 医疗研究场景，诚实多数假设
protocols:
  shamir:
    security_model: "semi_honest"
    adversary_model: "honest_majority"
    supports_preprocessing: false
    field_size: 64
    timeout_seconds: 240
  
  atlas:
    security_model: "semi_honest"
    adversary_model: "honest_majority"
    supports_preprocessing: false
    field_size: 64
    timeout_seconds: 300
  
  mascot:
    security_model: "malicious"
    adversary_model: "dishonest_majority"
    supports_preprocessing: true
    field_size: 64
    timeout_seconds: 600

# Security Configuration - 医疗级安全
security:
  authentication:
    token_expiry_minutes: 120   # 较长的会话时间用于研究
    max_failed_attempts: 5
    lockout_duration_minutes: 30
  
  access_control:
    default_role: "researcher"
    max_denied_attempts: 5
    lockout_duration_minutes: 30
  
  audit:
    storage_dir: "audit_logs_medical"
    max_file_size: 10485760     # 10MB
    compression: true
    retention_days: 2555        # 7年医疗记录保存要求

# Privacy Settings - 患者隐私保护
privacy:
  differential_privacy:
    epsilon: 1.0                # 平衡隐私和效用
    delta: 0.0001
  
  k_anonymity:
    k: 5                        # 标准k匿名
  
  l_diversity:
    l: 3                        # 标准l多样性
  
  default_privacy_level: "high"
  suppress_small_counts: true
  small_count_threshold: 5

# Data Processing - 医疗数据处理
data_processing:
  max_input_size_mb: 200
  supported_formats: ["csv", "json", "hl7", "dicom_metadata"]
  default_encoding: "utf-8"
  missing_value_strategies: ["median", "interpolation", "clinical_imputation"]
  
# Results Configuration
results:
  aggregation:
    quality_weights: true
    confidence_weights: true
    default_quality_threshold: 0.7
    default_confidence_threshold: 0.9
  
  visualization:
    default_format: "png"
    default_width: 1000
    default_height: 700
    default_style: "medical"
    privacy_level: "high"

# Network Configuration
network:
  default_host: "localhost"
  port_base: 7000
  ssl_enabled: true
  cert_dir: "certs_medical"
  timeout_seconds: 45

# Database Configuration
database:
  type: "encrypted_sqlite"
  path: "medical_mpc_research.db"
  backup_enabled: true
  backup_interval_hours: 12
  encryption_enabled: true

# Medical Specific Settings
medical:
  research_types:
    - "drug_efficacy"
    - "treatment_outcomes"
    - "epidemiological_study"
    - "biomarker_analysis"
  
  regulatory_compliance:
    - "HIPAA"
    - "FDA_GCP"
    - "ICH_GCP"
    - "GDPR"
  
  institutions:
    - name: "General Hospital"
      party_id: 0
      specialization: "cardiology"
      patient_cohort_size: "large"
      research_focus: "drug_trials"
    - name: "Research Medical Center"
      party_id: 1
      specialization: "oncology"
      patient_cohort_size: "medium"
      research_focus: "biomarkers"
    - name: "University Hospital"
      party_id: 2
      specialization: "neurology"
      patient_cohort_size: "large"
      research_focus: "treatment_outcomes"

# Study Parameters
study:
  name: "Multi-Center Drug Efficacy Study"
  protocol_id: "STUDY-2024-001"
  primary_endpoint: "treatment_response"
  secondary_endpoints:
    - "side_effects"
    - "quality_of_life"
    - "biomarker_changes"
  
  patient_data:
    demographics: ["age", "gender", "weight", "height"]
    medical_history: ["comorbidities", "medications", "allergies"]
    outcomes: ["response", "adverse_events", "survival"]
    biomarkers: ["lab_values", "imaging_scores"]